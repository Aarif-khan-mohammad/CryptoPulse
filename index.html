<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>CryptoPulse | Live Crypto Prices, Charts & Market Terminal</title>
    <meta name="description" content="Track live cryptocurrency prices, real-time charts, Fear & Greed index, whale alerts, and technical signals. Free professional crypto trading terminal powered by live market data." />
    <meta name="keywords" content="cryptocurrency prices, live crypto tracker, bitcoin price, ethereum price, crypto charts, fear greed index, crypto trading terminal, altcoin prices, DeFi tracker, crypto market cap" />
    <meta name="author" content="CryptoPulse" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://cryptopulse.vercel.app/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CryptoPulse" />
    <meta property="og:title" content="CryptoPulse | Live Crypto Prices & Trading Terminal" />
    <meta property="og:description" content="Professional crypto trading terminal with live prices, RSI charts, Fear & Greed index, whale alerts and profit calculator. Free, no signup required." />
    <meta property="og:url" content="https://cryptopulse.vercel.app/" />
    <meta property="og:image" content="https://cryptopulse.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CryptoPulse - Live Crypto Trading Terminal" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@CryptoPulseApp" />
    <meta name="twitter:title" content="CryptoPulse | Live Crypto Prices & Trading Terminal" />
    <meta name="twitter:description" content="Professional crypto trading terminal with live prices, RSI charts, Fear & Greed index, whale alerts and profit calculator." />
    <meta name="twitter:image" content="https://cryptopulse.vercel.app/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark" />

    <!-- Preconnect to external origins for faster API calls -->
    <link rel="preconnect" href="https://api.coingecko.com" />
    <link rel="preconnect" href="https://api.alternative.me" />
    <link rel="dns-prefetch" href="https://api.coingecko.com" />
    <link rel="dns-prefetch" href="https://api.alternative.me" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CryptoPulse",
      "url": "https://cryptopulse.vercel.app/",
      "description": "Professional live cryptocurrency tracking terminal with real-time prices, charts, technical indicators, Fear & Greed index, and whale alerts.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Live cryptocurrency prices",
        "Real-time price charts",
        "RSI and SMA technical indicators",
        "Fear and Greed Index",
        "Whale transaction alerts",
        "Profit/Loss calculator",
        "Price alerts with browser notifications",
        "Top gainers and losers",
        "DeFi and Meme coin filters"
      ],
      "screenshot": "https://cryptopulse.vercel.app/og-image.png",
      "creator": {
        "@type": "Organization",
        "name": "CryptoPulse"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
